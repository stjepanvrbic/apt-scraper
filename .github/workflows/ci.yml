# Runs the whole check suite, tests/run.sh or tests/run.ps1, on a fresh Linux, macOS and Windows machine.
# The same scripts run in Windows Sandbox on the owner's PC through tests/sandbox.ps1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gallery/package-lock.json
      - name: Checks
        if: runner.os != 'Windows'
        shell: bash
        run: tests/run.sh --work "$RUNNER_TEMP/apt-scraper-tests"
      - name: Checks
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, which the installer, the bootstrap and the uninstaller run in.
        shell: powershell
        run: tests/run.ps1 -Work "$env:RUNNER_TEMP/apt-scraper-tests"
      - name: Keep the test output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: |
            gallery/test-results
            ${{ runner.temp }}/apt-scraper-tests/pytest.xml
          if-no-files-found: ignore
